<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset your password</title></head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;color:#222;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f5f5;padding:40px 16px;"><tr><td align="center">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border-radius:8px;padding:40px;"><tr><td>
      <h1 style="margin:0 0 24px;font-size:24px;">Reset your password</h1>
      <p style="margin:0 0 16px;">Hello {{ user.name }},</p>
      <p style="margin:0 0 24px;">We received a request to reset the password for your account.</p>
      <p style="margin:0 0 32px;"><a href="{{ reset_url }}" style="display:inline-block;padding:12px 20px;background:#111;color:#fff;text-decoration:none;border-radius:6px;">Reset password</a></p>
      <p style="margin:0 0 16px;font-size:14px;color:#666;">This link expires at {{ expires_at }}.</p>
      <p style="margin:0;font-size:14px;color:#666;">If you did not request a password reset, you can safely ignore this email.</p>
      {{#if support_url}}<p style="margin:24px 0 0;font-size:13px;color:#888;">Need help? <a href="{{ support_url }}">Contact support</a>.</p>{{/if}}
    </td></tr></table>
  </td></tr></table>
</body>
</html>
