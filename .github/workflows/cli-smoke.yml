name: CLI smoke

on:
  pull_request:
  push:

jobs:
  cli-smoke:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: darwin-x64
            os: macos-13
          - platform: darwin-arm64
            os: macos-14

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node -p '`${process.platform}-${process.arch}`'
      - run: ./bin/authboundry.js --help
      - run: ./bin/authboundry.js status
